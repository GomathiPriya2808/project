<div class="min-h-screen bg-gradient-to-r from-green-400 to-blue-500 flex items-center justify-center px-4">
  <form
    [formGroup]="signupForm"
    (ngSubmit)="onSubmit()"
    class="w-full max-w-md bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-xl space-y-6"
  >
    <h2 class="text-2xl font-bold text-center text-gray-800">Create Account</h2>

    <!-- Name Field -->
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        autocomplete="name"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
      />
      <p *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.invalid" class="mt-1 text-red-600 text-sm">
        Name is required.
      </p>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        autocomplete="email"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
      />
      <div *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid" class="mt-1 text-red-600 text-sm">
        <p *ngIf="signupForm.get('email')?.errors?.['required']">Email is required.</p>
        <p *ngIf="signupForm.get('email')?.errors?.['email']">Please enter a valid email address.</p>
      </div>
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        autocomplete="new-password"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
      />
      <div *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid" class="mt-1 text-red-600 text-sm">
        <p *ngIf="signupForm.get('password')?.errors?.['required']">Password is required.</p>
        <p *ngIf="signupForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters long.</p>
        <p *ngIf="signupForm.get('password')?.errors?.['pattern']">
          Password must include at least one uppercase letter, one number, and one special character (! # $ % ^ & *).
        </p>
      </div>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="signupForm.invalid"
      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Sign up
    </button>

    <!-- Already Registered -->
    <p class="mt-6 text-center text-sm text-gray-200">
      Already registered?
      <a routerLink="/login" class="text-indigo-600 hover:underline font-medium">Login</a>
    </p>
  </form>
</div>
