<div class="min-h-screen image flex items-center justify-center px-4">
  <form
    [formGroup]="loginForm"
    (ngSubmit)="onLogin()"
    class="w-full max-w-md bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-xl space-y-6"
  >
    <h2 class="text-2xl font-bold text-center text-gray-800">
      Welcome to the Login
    </h2>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700"
        >Email address</label
      >
      <input
        type="email"
        id="email"
        formControlName="email"
        autocomplete="email"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
      />
    </div>

    <div class="relative">
      <label
        for="password"
        class="block text-sm font-medium text-gray-700 mb-1"
      >
        Password
      </label>

      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        formControlName="password"
        autocomplete="current-password"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 pr-10 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
      />

      <!-- 👁 Eye icon toggle -->
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute top-9 right-3 text-gray-500 hover:text-black"
      >
      @if(showPassword){
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
          />
        </svg>
      }
        @if(!showPassword){
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.978 9.978 0 013.668-4.775m3.267-1.43A9.97 9.97 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.961 9.961 0 01-4.125 5.225M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 3l18 18"
          />
        </svg>
        }
      </button>

      <!-- Forgot password link -->
      <a
        routerLink="/forgot-password"
        class="block mt-2 text-sm text-indigo-600 hover:underline text-right"
      >
        Forgot password?
      </a>
    </div>

    <button
      type="submit"
      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition"
    >
      Login
    </button>
    @if (error) {
    <div
      class="text-red-600 text-sm bg-red-100 p-2 border border-red-300 rounded mt-2"
    >
      {{ error }}
    </div>
    } @if (success) {
    <div
      class="text-green-600 text-sm bg-green-100 p-2 border border-green-300 rounded mt-2"
    >
      {{ success }}
    </div>
    }

    <p class="mt-6 text-center text-sm text-gray-600">
      Don’t have an account?
      <a
        routerLink="/signup"
        class="text-indigo-600 font-medium hover:underline"
        >Sign up</a
      >
    </p>
  </form>
</div>
