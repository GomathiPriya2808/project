<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="w-full max-w-md bg-white p-8 rounded-lg shadow space-y-6">
     <div>
      <label for="email" class="block text-sm font-medium text-gray-900">Email address</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        autocomplete="email"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-900">Password</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        autocomplete="current-password"
        required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
      />
      <a onclick ="forgotPassword()" class="block mt-1 text-sm text-indigo-600 hover:underline text-right">Forgot password?</a>
    </div>

    <button
      type="submit"
      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none"
    >
      Login
    </button>

    <!-- Already Registered -->
    <p class="mt-6 text-center text-sm text-gray-600">
      Create An Account?
      <a routerLink="/signup" class="text-indigo-600 hover:underline font-medium">Signup</a>
    </p>
  </form>
</div>
