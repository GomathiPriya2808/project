<div class="max-w-md mx-auto mt-10 p-6 border rounded shadow">
  <h2 class="text-2xl font-bold mb-4 text-center">Forgot Password</h2>

  <form [formGroup]="forgotForm" (ngSubmit)="forgotPassword()">
    <label class="block mb-2 font-medium">Email Address</label>
    <input
      formControlName="email"
      type="email"
      placeholder="Enter your email"
      class="w-full border rounded px-3 py-2 mb-4"
    />

    <button
      type="submit"
      class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700"
    >
      Send Reset Link
    </button>
  </form>
@if(errorMessage()){
  <p  class="text-red-600 mt-4 text-sm text-center">
    {{ errorMessage() }}
  </p>
}
@if(successMessage()){
  <p class="text-green-600 mt-4 text-sm text-center">
    {{ successMessage() }}
  </p>
}
</div>
